# Single sign-on example: people in a browser sign in with oauth2-proxy (OIDC) before Caddy forwards their requests.
# Requests with core's bearer token and signed upload/download links go straight to core, which checks them itself.
# Checked with a local mock OIDC issuer only, not a production IdP. Serve it behind TLS (the cookie is Secure):
#   docker compose -f docker/compose.yaml -f docker/compose.sso.yaml up -d

# Every OIDC value below is required (no defaults): export them or put them in an untracked .env file, never commit
# them. Placeholders for reference: OIDC_ISSUER_URL=https://idp.example/, OIDC_CLIENT_ID=change-me, OIDC_CLIENT_SECRET=change-me.
# The provider settings are for a generic OIDC issuer.
#
# WARNING: Never combine with KOLDERA_AUTH=none: bearer and signed requests bypass sign-in;
# core's own KOLDERA_TOKEN must stay set.

# Core still requires its own bearer token on /v1: oauth2-proxy proves who the person is, it does not
# replace KOLDERA_TOKEN. Signing in alone gives a browser no access to /v1; see docs/deployment.md.

services:
  front:
    # Replace the plain-HTTP front with Caddy plus a forward_auth check against oauth2-proxy.
    # Same container path as in compose.yaml, so Compose replaces that mount (merge key is the target path).
    volumes:
      - ./Caddyfile.sso:/etc/caddy/Caddyfile:ro
    depends_on:
      - oauth2-proxy

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    restart: unless-stopped
    command:
      - --http-address=0.0.0.0:4180
      - --provider=oidc
      - --oidc-issuer-url=${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL}
      - --email-domain=${SSO_EMAIL_DOMAIN:?set SSO_EMAIL_DOMAIN}
      - --upstream=static://202
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --cookie-secure=true
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      # 32 random bytes, base64: openssl rand -base64 32 | tr -- '+/' '-_'
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET:?set OAUTH2_COOKIE_SECRET (openssl rand -base64 32 | tr -- +/ -_)}
      OAUTH2_PROXY_REDIRECT_URL: ${OIDC_REDIRECT_URL:?set OIDC_REDIRECT_URL}
    # The identity provider is outside, so this one needs the outbound network as well.
    networks: [internal, outbound]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
