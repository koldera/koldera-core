# Egress proxy for the web scanner (SSRF controls): the only network path out of the
# scanner container. Enforces PUBLIC destinations at connection time, which the app-layer checks
# in the scanner cannot guarantee on their own (DNS rebinding, redirects followed by the browser).
#
# Run with: squid -N -f /etc/squid/squid.conf   (image: ubuntu/squid or sameersbn/squid, pinned in compose)
http_port 3128

# Destination classes that are never reachable, whatever name they were resolved from.
acl to_private dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
# Squid keeps every IPv4 destination as an IPv4-mapped IPv6 address internally, so ::ffff:0:0/96
# must NOT appear here (it would match all of IPv4); the IPv4 ranges above already cover it.
# 2002::/16 (6to4), 2001::/32 (Teredo), ::/96 (IPv4-compatible) and ::ffff:0:0:0/96 (SIIT) match the scanner's own blocklist.
acl to_private6 dst ::/128 ::1/128 64:ff9b::/96 fc00::/7 fe80::/10 fec0::/10 2001:db8::/32 ff00::/8 100::/64 2002::/16 2001::/32 ::/96 ::ffff:0:0:0/96
# A leading dot matches the domain itself and every subdomain (Squid rejects duplicates such as a
# bare `localhost` or `metadata.google.internal` next to `.internal`).
acl to_localnames dstdomain .localhost .local .internal .localdomain .home.arpa
acl safe_ports port 80 443

http_access deny to_private
http_access deny to_private6
http_access deny to_localnames
# Ports 80 and 443 only, CONNECT included: the scanner tunnels plain http as well (its fetches CONNECT to port 80).
http_access deny !safe_ports
http_access allow all

# A refusal answers with an empty page (ERR_KOLDERA_REFUSED is an empty file). A client tunnelling through the proxy
# gets the refusal replayed as the response from the bytes that came with the headers, so a body would be cut off;
# empty, it is always whole and the scanner reliably reads X-Squid-Error and reports the destination as blocked.
# English templates only, no language negotiation.
error_directory /usr/share/squid/errors/templates
deny_info ERR_KOLDERA_REFUSED to_private
deny_info ERR_KOLDERA_REFUSED to_private6
deny_info ERR_KOLDERA_REFUSED to_localnames
deny_info ERR_KOLDERA_REFUSED safe_ports

# No caching, no persistent state, bounded bodies: 5 MB per response (documented in docs/deployment.md; raise or
# delete the line and rebuild the image to change it).
cache deny all
reply_body_max_size 5 MB
request_header_access Cookie deny all
request_header_access Authorization deny all
request_header_access Referer deny all
forwarded_for delete
via off
