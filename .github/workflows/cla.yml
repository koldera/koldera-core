name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# The action records signatures by committing to the cla-signatures branch and comments on the pull request.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    # Runs only for the sign phrase or a pull request event; no pull request code is checked out or executed.
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          # GITHUB_TOKEN is enough inside a private repository; a PAT is only needed to write to another repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/koldera/koldera-core/blob/main/CLA.md
          branch: cla-signatures
          allowlist: makulatura78,bot*,dependabot[bot],github-actions[bot]
