name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # workflow run metadata the CodeQL action reads in a private repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: engine/pom.xml
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - if: matrix.language == 'csharp'
        run: dotnet build server/Koldera.Core.slnx -c Release
      - if: matrix.language == 'java-kotlin'
        run: mvn -B -q -DskipTests package
        working-directory: engine
      # Code Security is not available on this private repository, so results are not uploaded to Code Scanning.
      # The SARIF is checked here instead: any error or warning result fails the job.
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          upload: never
          upload-database: false
          output: sarif-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Fail on error or warning results
        run: |
          # A result without its own level takes its rule's default level, and SARIF's default is "warning".
          jq -r '.runs[] | ([.tool.driver.rules[]?, .tool.extensions[]?.rules[]?] | map({key: .id, value: (.defaultConfiguration.level // "warning")}) | from_entries) as $lv
            | .results[]? | select((.suppressions // []) | length == 0)
            | (.ruleId // .rule.id) as $id | (.level // $lv[$id] // "warning") as $level
            | select($level == "error" or $level == "warning")
            | "\($level) \($id) \(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // "?") \(.message.text | split("\n")[0])"' \
            sarif-results/*.sarif | tee findings.txt
          echo "CodeQL findings (error/warning): $(wc -l < findings.txt)"
          test ! -s findings.txt
