name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# A tagged AGPL release is packaged into a draft GitHub Release for review before publication. The image is
# included in the bundle; no image is pushed to a registry. See RELEASING.md.
jobs:
  # The full CI workflow for the tagged commit: nothing is packaged unless every test job passes.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  on-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag points at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  bundle:
    needs: [ci, on-main]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the packaging script resolves the tag
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: created
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build the image (linux/amd64, loaded locally, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: koldera-core:${{ steps.version.outputs.version }}
          build-args: KOLDERA_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.created=${{ steps.created.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Install gitleaks (pinned release, SHA-256 checked) outside the checkout
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          dirname "$SYFT_CMD" >> "$GITHUB_PATH"
      - name: Package the bundle
        run: node scripts/package-release.mjs "$GITHUB_REF_NAME" --image "koldera-core:${GITHUB_REF_NAME#v}" --out "$RUNNER_TEMP/release"
      - name: Verify the bundle checksums
        working-directory: ${{ runner.temp }}/release
        run: |
          sha256sum -c "koldera-core-${GITHUB_REF_NAME}.tar.gz.sha256"
          (cd "koldera-core-${GITHUB_REF_NAME}" && sha256sum --quiet -c SHA256SUMS)
          mkdir assets
          mv "koldera-core-${GITHUB_REF_NAME}.tar.gz" "koldera-core-${GITHUB_REF_NAME}.tar.gz.sha256" assets/
          for f in SHA256SUMS release-manifest.json sbom.spdx.json; do
            cp "koldera-core-${GITHUB_REF_NAME}/$f" "assets/koldera-core-${GITHUB_REF_NAME}-$f"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release/assets/
          if-no-files-found: error
          retention-days: 1 # the draft release keeps the copy
          compression-level: 0 # already gzipped

  release:
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # gh release create (draft)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: assets
      - name: Draft GitHub Release with the bundle
        working-directory: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -c "koldera-core-${GITHUB_REF_NAME}.tar.gz.sha256"
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" ./* --draft --generate-notes --verify-tag $flags
