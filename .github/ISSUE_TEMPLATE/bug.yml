name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not attach real customer documents or secrets; a small synthetic file that shows the
        problem is enough. Security problems go through the private report described in SECURITY.md, not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit, from `GET /v1/info` or `koldera --version`
      placeholder: ghcr.io/koldera/core:0.1.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - PDF analyze or fix
        - HTML to PDF
        - Structured document
        - Web scan
        - Reading order
        - HTTP API
        - Command line
        - Docker or deployment
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected and what you got. Include the problem `code` or the job `error` if there is one.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Remove tokens, URLs with credentials and document content.
      render: text
