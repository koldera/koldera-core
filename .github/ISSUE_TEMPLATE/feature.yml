name: Feature request
description: Suggest an addition or a change
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        koldera-core reports machine checks and never guesses meaning the document does not state. A request that would
        make it generate alternative text or claim a result it cannot know will be declined; a request for better
        evidence for a person to review is welcome.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see? For an API change, name the route, fields and errors.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: cla
    attributes:
      label: Contribution
      options:
        - label: I would be willing to send a pull request (and sign the CLA).
